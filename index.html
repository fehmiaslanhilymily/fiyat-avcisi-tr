<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FiyatAvcısı TR — İndirim & Hatalı Fiyat Takip</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #131b33;
      --card: #182240;
      --border: #283663;
      --text: #eef2ff;
      --muted: #9aa8d0;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green: #10b981;
      --red: #ef4444;
      --amber: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px 16px; }
    .container { max-width: 1140px; margin: 0 auto; }
    .hero {
      background: linear-gradient(135deg, #172554 0%, #131b33 60%, #1e1b4b 100%);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: space-between;
      align-items: center;
    }
    .hero h1 { font-size: 1.6rem; margin-bottom: 6px; }
    .hero p { color: var(--muted); font-size: 0.95rem; }
    .badges { display: flex; flex-wrap: wrap; gap: 10px; }
    .pill {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      color: var(--text);
    }
    .pill.live { border-color: rgba(16,185,129,0.5); color: #6ee7b7; }
    .controls {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 768px) { .controls { grid-template-columns: 1fr; } }
    input, select {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.92rem;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .card:hover { transform: translateY(-3px); border-color: #4f67b8; }
    .card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .platform-tag {
      background: rgba(59,130,246,0.18);
      color: #93c5fd;
      border: 1px solid rgba(59,130,246,0.35);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .deal-badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
    }
    .deal-error { background: rgba(239,68,68,0.2); color: #fca5a5; border: 1px solid rgba(239,68,68,0.45); }
    .deal-normal { background: rgba(16,185,129,0.2); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.45); }
    .title { font-size: 1rem; font-weight: 600; line-height: 1.4; }
    .prices { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .current { font-size: 1.35rem; font-weight: 800; color: #ffffff; }
    .old { font-size: 0.92rem; color: var(--muted); text-decoration: line-through; }
    .pct { font-size: 0.85rem; font-weight: 700; color: #34d399; }
    .btn {
      display: block;
      text-align: center;
      text-decoration: none;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      padding: 11px 14px;
      border-radius: 10px;
      transition: background 0.15s ease;
    }
    .btn:hover { background: var(--accent-hover); }
    .empty {
      grid-column: 1 / -1;
      background: var(--panel);
      border: 1px dashed var(--border);
      border-radius: 14px;
      padding: 36px;
      text-align: center;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero">
      <div>
        <h1>🎯 FiyatAvcısı TR</h1>
        <p>Normal fiyatının altına düşen ve ekstra indirime giren ürünler — doğrudan ürün sayfasına yönlendirme</p>
      </div>
      <div class="badges">
        <span class="pill live">● Otomatik Tarama: Her 2 Saatte Bir</span>
        <span class="pill" id="lastUpdated">Son Güncelleme: --</span>
        <span class="pill" id="totalCount">0 Fırsat</span>
      </div>
    </div>

    <div class="controls">
      <input type="text" id="searchInput" placeholder="Ürün veya marka ara..." />
      <select id="platformFilter">
        <option value="ALL">Tüm Platformlar</option>
        <option value="Trendyol">Trendyol</option>
        <option value="Hepsiburada">Hepsiburada</option>
        <option value="Amazon TR">Amazon TR</option>
        <option value="N11">N11</option>
        <option value="Pazarama">Pazarama</option>
        <option value="Teknosa">Teknosa</option>
      </select>
      <select id="typeFilter">
        <option value="ALL">Tüm İndirimler</option>
        <option value="ERROR_PRICE">🔥 Hatalı Fiyat (%60+)</option>
        <option value="NORMAL_DEAL">⚡ Ekstra İndirim</option>
      </select>
      <select id="sortFilter">
        <option value="discount_desc">İndirim Oranına Göre</option>
        <option value="price_asc">Fiyata Göre (Düşük → Yüksek)</option>
        <option value="price_desc">Fiyata Göre (Yüksek → Düşük)</option>
      </select>
    </div>

    <div class="grid" id="dealsGrid"></div>
  </div>

  <script>
    let allDeals = [];

    function formatTL(val) {
      return Number(val || 0).toLocaleString("tr-TR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " ₺";
    }

    function renderDeals() {
      const q = document.getElementById("searchInput").value.toLowerCase().trim();
      const plat = document.getElementById("platformFilter").value;
      const dtype = document.getElementById("typeFilter").value;
      const sort = document.getElementById("sortFilter").value;

      let list = allDeals.filter(d => {
        const matchQ = !q || d.title.toLowerCase().includes(q) || d.platform.toLowerCase().includes(q);
        const matchP = plat === "ALL" || d.platform === plat;
        const matchT = dtype === "ALL" || d.deal_type === dtype;
        return matchQ && matchP && matchT;
      });

      if (sort === "discount_desc") list.sort((a, b) => b.discount_pct - a.discount_pct);
      if (sort === "price_asc") list.sort((a, b) => a.current_price - b.current_price);
      if (sort === "price_desc") list.sort((a, b) => b.current_price - a.current_price);

      document.getElementById("totalCount").textContent = `${list.length} Fırsat`;
      const grid = document.getElementById("dealsGrid");

      if (!list.length) {
        grid.innerHTML = `<div class="empty">Seçili filtrelere uygun fırsat bulunamadı.</div>`;
        return;
      }

      grid.innerHTML = list.map(d => {
        const isErr = d.deal_type === "ERROR_PRICE";
        const badgeClass = isErr ? "deal-error" : "deal-normal";
        const badgeText = isErr ? `🔥 Hatalı Fiyat %${d.discount_pct}` : `⚡ %${d.discount_pct} İndirim`;
        const safeUrl = (d.url && d.url.startsWith("http")) ? d.url : "#";

        return `
          <div class="card">
            <div>
              <div class="card-top" style="margin-bottom: 10px;">
                <span class="platform-tag">${d.platform}</span>
                <span class="deal-badge ${badgeClass}">${badgeText}</span>
              </div>
              <div class="title">${d.title}</div>
            </div>
            <div>
              <div class="prices" style="margin-bottom: 12px;">
                <span class="current">${formatTL(d.current_price)}</span>
                <span class="old">${formatTL(d.old_price)}</span>
                <span class="pct">-%${d.discount_pct}</span>
              </div>
              <a class="btn" href="${safeUrl}" target="_blank" rel="noopener noreferrer">Ürüne Git →</a>
            </div>
          </div>
        `;
      }).join("");
    }

    async function loadData() {
      try {
        const res = await fetch("data/deals.json?t=" + Date.now());
        const data = await res.json();
        document.getElementById("lastUpdated").textContent = "Son Güncelleme: " + (data.last_updated || "--");
        allDeals = data.deals || [];
        renderDeals();
      } catch (e) {
        document.getElementById("dealsGrid").innerHTML = `<div class="empty">Veriler yüklenemedi.</div>`;
      }
    }

    ["searchInput", "platformFilter", "typeFilter", "sortFilter"].forEach(id => {
      document.getElementById(id).addEventListener("input", renderDeals);
      document.getElementById(id).addEventListener("change", renderDeals);
    });

    loadData();
  </script>
</body>
</html>
